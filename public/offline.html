<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1f3a" />
    <title>CivicLens – offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0b1f3a; color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #b3c6ea; max-width: 300px; margin: 0 auto 20px; line-height: 1.5; }
      button { background: #fff; color: #0b1f3a; border: 0; border-radius: 10px; padding: 14px 28px; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>CivicLens needs a connection to send complaints and load live tickets. Check your internet and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
